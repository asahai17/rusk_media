name: md_television
description: "MD Television - Micro-Drama Interactive Player"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  video_player: ^2.9.2
  google_mobile_ads: ^9.0.0
  get_it: ^8.0.2
  wakelock_plus: ^1.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Already resolved transitively through video_player; listed so tests can
  # install a fake VideoPlayerPlatform without a device.
  video_player_platform_interface: ^6.9.0
  flutter_launcher_icons: "^0.14.4"
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Appicon.png"
  adaptive_icon_background: "#141423"
  adaptive_icon_foreground: "assets/images/Appicon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0A0A12"
  image: assets/images/Splash.png
  android: true
  ios: true
  android_gravity: fill
  ios_content_mode: scaleAspectFill

flutter:
  uses-material-design: true
  assets:
    - assets/images/
